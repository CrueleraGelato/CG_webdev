<!DOCTYPE html>
<html lang="en"> 
    <head> 
        <title>Aligment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin:8px;
                margin-left: 50px;
            }
            #box{
                width: 200px;
                height:200px;
                background-color:rgb(250, 165,85);
                color:rgb(3, 26, 26);
                text-align: center; 
                margin-top: 35px;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: column;
                justify-content: space-between; 
                align-items: center;
                flex-wrap: wrap;
            }
    
        </style>
    </head>
    <body> 
        <h1> Alignment notes</h1>
        <div id="box-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
             <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
         <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
             <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
    <button>CLick Me</button>
    </body>
</html>
