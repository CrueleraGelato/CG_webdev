<!DOCTYPE html>
<html lang="en"> 
    <head> 
        <title>Aligment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin:8px;
                margin-left: 50px;
            }
            #box, #boxTwo{
                width: 200px;

                background-color:rgb(250, 165,85);
                color:rgb(3, 26, 26);
                text-align: center; 
                margin-top: 35px;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: column;
                justify-content: space-between; 
                align-items: center;
                flex-wrap: wrap;
            }
    
        </style>
    </head>

            </div>
            <div id="boxTwo">

            </div>
            <div id="box">

            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <div id="flex-wrapper">

            </div>
        </div>

        <br>

                let newColor= document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor =newColor
            }
            function dissapear(){ 
                document.getElementById("boxTwo").style.display='none'
            }
            function appear(){
                document.getElementById("boxTwo").style.display='block'
            }

                    document.getElementById("showMore").innerHTML = "Show More"
                }else{

                }
            }
        </script>
    </body>
</html>
